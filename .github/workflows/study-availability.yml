name: Study room availability

# Reads the public LibCal booking grid for the library study rooms and
# publishes it as one JSON file on the `live-data` branch, which the site
# loads. Three small requests per run, ten seconds apart. To stop it, disable
# this workflow under Actions; the site then says live data is unavailable.
on:
  schedule:
    # Every 20 minutes from 7 am to midnight St. Louis time (UTC-5/-6).
    - cron: '7,27,47 12-23,0-6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: study-availability
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the booking grid
        run: |
          mkdir live
          node scripts/fetch-availability.mjs live/study-availability.json
      - name: Publish to the live-data branch
        run: |
          cd live
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-availability.json
          git commit -q -m "Study room availability"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
